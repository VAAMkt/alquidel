name: PR Review

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun x prettier --check .

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
